version: '3.8'

services:
  aegissec:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegissec-platform
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=production
    volumes:
      - aegissec_data:/app/backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/auth/me"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  aegissec_data:
    driver: local
