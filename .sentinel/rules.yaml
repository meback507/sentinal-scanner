# Sentinel Enterprise Project-Specific Custom Security Rules
# This file is automatically loaded by the Sentinel IDE Plugin, CLI, and Scan Engines.
version: "1.0"
project: "sentinel-scanner"

rules:
  - id: "PROJ-SAST-001"
    name: "Unsafe Insecure YAML Deserialization via yaml.load"
    type: "sast"
    severity: "CRITICAL"
    languages:
      - "python"
    cwe: "CWE-502"
    cvss: 9.8
    standards:
      - "OWASP:A08:2021"
      - "ISO-27001:A.8.28"
    regex: "(?i)yaml\\.load\\s*\\([^,)]*\\)(?!.*Loader=)"
    description: "Calling yaml.load without specifying a safe Loader permits arbitrary object deserialization and remote code execution."
    remediation: "Always use yaml.safe_load(data) or specify Loader=yaml.SafeLoader."

  - id: "PROJ-SAST-002"
    name: "Unbounded Global Dictionary Cache"
    type: "sast"
    severity: "HIGH"
    languages:
      - "python"
    cwe: "CWE-400"
    cvss: 7.5
    standards:
      - "OWASP:A04:2021"
      - "ISO-27001:A.8.28"
    regex: "(?i)GLOBAL_CACHE\\[[^\\]]+\\]\\s*="
    description: "Direct unbounded assignment to an in-memory global dictionary can cause memory exhaustion and denial of service under high load."
    remediation: "Use a bounded cache implementation such as functools.lru_cache or an external cache with TTL (Redis/Memcached)."

  - id: "PROJ-IAC-001"
    name: "Enforce Non-Root Application Container User"
    type: "iac"
    severity: "HIGH"
    languages:
      - "dockerfile"
    cwe: "CWE-250"
    cvss: 7.8
    standards:
      - "CIS:Docker:4.1"
      - "NIST-SSDF:PW.1.1"
    regex: "(?i)^USER\\s+(?:root|0)(?:\\s|$)"
    description: "Container explicitly declares execution as root user, increasing the attack surface if a container escape vulnerability is exploited."
    remediation: "Create and switch to an unprivileged dedicated service account: RUN useradd -u 10001 appuser && USER appuser"

  - id: "PROJ-SEC-001"
    name: "Sentinel Internal Service Mesh Token Pattern"
    type: "secret"
    severity: "CRITICAL"
    languages:
      - "python"
      - "javascript"
      - "yaml"
      - "json"
      - "shell"
    cwe: "CWE-798"
    cvss: 9.1
    standards:
      - "ISO-27001:A.8.12"
      - "CIS:SupplyChain:1.2"
    regex: "(?i)SENTINEL_TOKEN_[0-9a-zA-Z_-]{24,}"
    description: "Found hardcoded internal Sentinel cluster authentication token embedded directly in source code."
    remediation: "Store cluster mesh tokens in an environment secret or Vault and inject at runtime."
